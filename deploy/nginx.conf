# ENT Prep — Nginx Production Config
# Используется, когда платформа развёрнута на собственном сервере
# (не Render.com). На Render статику раздаёт WhiteNoise.

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name ent-prep.kz www.ent-prep.kz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name ent-prep.kz www.ent-prep.kz;

    ssl_certificate     /etc/ssl/certs/ent-prep.crt;
    ssl_certificate_key /etc/ssl/private/ent-prep.key;

    client_max_body_size 20M;

    # Статика — кэшируется на год
    location /static/ {
        alias /var/www/ent-prep/backend/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа (картинки вопросов) — кэшируется
    location /media/ {
        alias /var/www/ent-prep/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Всё остальное — на Django через Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
